version: '3.9'

services:

  # ─── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend
    depends_on:
      - backend
      - frontend
    networks:
      - stockflow

  # ─── Laravel Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/backend
      - /var/www/backend/vendor
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY:-base64:ZHVtbXlTdG9ja0Zsb3dMb2NhbEFwcEtleTEyMzQ1Njc=}
      - DB_HOST=mysql
      - DB_DATABASE=stockflow
      - DB_USERNAME=stockflow
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=array
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=stockflow
      - AWS_SECRET_ACCESS_KEY=secret123
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=stockflow
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stockflow

  # ─── Queue Worker ────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/backend
      - /var/www/backend/vendor
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY:-base64:ZHVtbXlTdG9ja0Zsb3dMb2NhbEFwcEtleTEyMzQ1Njc=}
      - DB_HOST=mysql
      - DB_DATABASE=stockflow
      - DB_USERNAME=stockflow
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=array
    depends_on:
      - backend
      - redis
    networks:
      - stockflow

  # ─── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
      - NEXT_PUBLIC_APP_NAME=StockFlow
    networks:
      - stockflow

  # ─── MySQL 8 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockflow

  # ─── MySQL Test Database ─────────────────────────────────────────────────────
  mysql_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: stockflow_test
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockflow

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stockflow

  # ─── MinIO (S3-compatible storage) ──────────────────────────────────────────
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: stockflow
      MINIO_ROOT_PASSWORD: secret123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - stockflow

  # ─── Mailpit (local email testing) ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - stockflow

volumes:
  mysql_data:
  mysql_test_data:
  redis_data:
  minio_data:

networks:
  stockflow:
    driver: bridge
